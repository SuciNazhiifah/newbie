<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pendaftaran Lomba</title>
</head>
<body>
    <h1>Formulir Pendaftaran Lomba</h1>

    <form action="#" method="POST">
        <!-- Input Nama Lengkap -->
        <label for="nama">Nama Lengkap:</label>
        <input 
          type="text" 
          id="nama" 
          name="nama" 
          placeholder="Masukkan Nama Lengkap"
          required
        />

    <!-- Input Email -->
     <label for="email">Email:</label>
    <input 
        type="email" 
        id="email" 
        name="email" 
        placeholder="blablabla@gmail.com"
        required
    />

    <!-- Input Password -->
     <label for="password">Password:</label>
    <input 
        type="password" 
        id="password" 
        name="password" 
        placeholder="Masukkan Password"
        required
    />

    <!-- Input Umur -->
     <label for="umur">Umur:</label>
    <input 
        type="number" 
        id="umur" 
        name="umur" 
        placeholder="Masukkan Umur"
        required
    />
    </form>


</body>
</html>
